# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'duck_db_trial'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'duck_db_trial'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Statistiche d'uso anonime disattivate: dbt non crea piu' il file .user.yml
flags:
  send_anonymous_usage_stats: false

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# Tutti i layer sono tabelle DuckLake: metadati su Postgres Neon, dati come file Parquet su Tigris.
# Il catalogo si chiama lakehouse_<target> (lakehouse_dev, lakehouse_prd): l'alias e' assegnato
# da ducklake_plugin.py e vale solo per la sessione. Alias diversi per ambiente permettono a
# dbt --defer di leggere dal catalogo di produzione (lakehouse_prd) in una sessione dev.
models:
  duck_db_trial:
    bronze:
      +database: "lakehouse_{{ target.name }}"
      +materialized: table
      +schema: bronze
    silver:
      +database: "lakehouse_{{ target.name }}"
      +materialized: table
      +schema: silver
    gold:
      +database: "lakehouse_{{ target.name }}"
      +materialized: table
      +schema: gold
