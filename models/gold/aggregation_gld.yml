version: 2

models:
  - name: aggregation_gld
    description: "Riepilogo per cliente: numero di ordini, spesa totale e data dell'ultimo ordine."
    columns:
      - name: customer_id
        description: "Identificativo del cliente."
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: "Nome e cognome del cliente."
      - name: email
        description: "Email del cliente."
      - name: total_orders
        description: "Numero di ordini non cancellati."
      - name: total_spent
        description: "Somma degli importi degli ordini."
      - name: last_order_date
        description: "Data dell'ultimo ordine."
